<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#231a48"/>
      <stop offset="70%" stop-color="#0e0a20"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22e6e0"/>
      <stop offset="100%" stop-color="#12a8a3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- sound burst -->
  <g stroke="#ffcf3f" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M 350 120 q 40 -30 80 -18"/>
    <path d="M 365 170 q 30 -12 58 -4"/>
    <path d="M 120 120 q -40 -30 -80 -18" stroke="#ff3d8d"/>
    <path d="M 105 170 q -30 -12 -58 -4" stroke="#ff3d8d"/>
  </g>
  <!-- mic head -->
  <circle cx="236" cy="170" r="92" fill="url(#mic)"/>
  <g stroke="#0e0a20" stroke-width="9" opacity=".55">
    <line x1="152" y1="140" x2="320" y2="140"/>
    <line x1="146" y1="170" x2="326" y2="170"/>
    <line x1="152" y1="200" x2="320" y2="200"/>
  </g>
  <!-- mic collar + handle -->
  <rect x="196" y="252" width="80" height="34" rx="14" fill="#ffcf3f"/>
  <path d="M 226 286 L 202 420 q 30 22 68 0 L 246 286 Z" fill="#ff3d8d"/>
  <circle cx="236" cy="432" r="26" fill="#ff3d8d"/>
</svg>
