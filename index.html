:root{
  --stage:#0e0a20; --stage2:#231a48;
  --neon:#ff3d8d; --ice:#22e6e0; --sun:#ffcf3f;
  --paper:#f8f5ff; --dim:#9088bb; --panel:#151030; --line:#3a2f63;
  --good:#7CFC6B; --good-d:#3f9c33;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
/* When the mobile URL bar retracts the visible area grows, but height:100%
   still resolves against the unchanged layout viewport — so the body box ends
   short of the screen. Left repeating, the gradient tiled a second bright edge
   into that gap. Paint the base colour on the root and stop it repeating: the
   gradient is already solid --stage from 62% down, so the seam is invisible. */
html{background:var(--stage);}
body{
  background:var(--stage) radial-gradient(120% 90% at 50% 0%, var(--stage2) 0%, var(--stage) 62%) no-repeat;
  color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.display{font-family:'Bungee',system-ui,sans-serif;letter-spacing:.02em;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;}
.screen.on{display:flex;}
.screen.scroll{justify-content:flex-start;overflow-y:auto;padding-top:max(24px,env(safe-area-inset-top,0px) + 14px);padding-bottom:40px;}
h1.logo{
  font-size:clamp(34px,10vw,58px);line-height:1.02;color:#fff;
  text-shadow:3px 3px 0 var(--neon), -2px -2px 0 var(--ice), 0 0 28px rgba(255,61,141,.45);
}
h1.logo.small{font-size:clamp(26px,7vw,40px);}
.micmoji{font-size:clamp(44px,14vw,72px);animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(34,230,224,.5));}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-10px) rotate(8deg);}}
@media (prefers-reduced-motion: reduce){.micmoji{animation:none;}}
.sub{color:var(--dim);margin-top:10px;font-size:15px;max-width:340px;}
.btn{
  border:0;border-radius:16px;padding:16px 26px;font-size:18px;cursor:pointer;
  font-family:'Bungee',system-ui;color:var(--stage);background:var(--sun);
  box-shadow:0 6px 0 #b8931f;transition:transform .05s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8931f;}
.btn.hot{background:var(--neon);color:#fff;box-shadow:0 6px 0 #a3134c;}
.btn.hot:active{box-shadow:0 2px 0 #a3134c;}
.btn.ice{background:var(--ice);color:var(--stage);box-shadow:0 6px 0 #128a86;}
.btn.ice:active{box-shadow:0 2px 0 #128a86;}
.btn.ghost{background:transparent;color:var(--dim);box-shadow:none;font-family:system-ui;font-size:14px;padding:10px;}
.btn.wide{width:min(320px,86vw);}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center;}
/* setup */
#players{display:flex;flex-direction:column;gap:8px;width:min(340px,90vw);margin:16px 0 8px;}
.prow{display:flex;gap:8px;align-items:center;}
.dot{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.25);}
.prow input{
  flex:1;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--paper);
  padding:10px 12px;font-size:16px;outline:none;min-width:0;
}
.prow input:focus{border-color:var(--ice);}
.prow .rm{background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 8px;}
.opt{margin:14px 0 6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.14em;}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center;}
.seg button{border:0;background:transparent;color:var(--dim);padding:8px 13px;border-radius:9px;font-size:14px;cursor:pointer;}
.seg button.sel{background:var(--ice);color:var(--stage);font-weight:700;}
.toggles{display:flex;flex-direction:column;gap:8px;width:min(340px,90vw);}
.tog{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;}
.tog .lbl{flex:1;font-size:14px;}
.tog .lbl small{display:block;color:var(--dim);font-size:12px;margin-top:2px;}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s;}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:left .15s;}
.tog.on .sw{background:var(--ice);}
.tog.on .sw::after{left:21px;}
details.adv{width:min(340px,90vw);margin-top:14px;}
details.adv summary{color:var(--dim);font-size:13px;cursor:pointer;list-style:none;text-transform:uppercase;letter-spacing:.12em;}
details.adv summary::before{content:"▸ ";}
details.adv[open] summary::before{content:"▾ ";}
/* grab arena */
#arena{position:fixed;inset:0;}
#zones{position:absolute;inset:0;width:100%;height:100%;}
.wedge{stroke:var(--stage);stroke-width:3;transition:opacity .2s;}
.wedge.dead{opacity:.16;}
.zlabel{font-family:'Bungee',system-ui;fill:#0e0a20;font-size:19px;pointer-events:none;}
#centerDisc{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(62vw,300px);height:min(62vw,300px);border-radius:50%;
  background:radial-gradient(circle at 50% 35%, #2c2152, #0e0a20 75%);
  border:5px solid var(--sun);box-shadow:0 0 40px rgba(255,207,63,.45),inset 0 0 30px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  pointer-events:none;padding:14px;
}
#cd{font-size:clamp(60px,20vw,96px);color:var(--ice);text-shadow:0 0 20px rgba(34,230,224,.6);}
#word{font-size:clamp(28px,9vw,50px);color:var(--sun);line-height:1;word-break:break-word;
  text-shadow:0 0 18px rgba(255,207,63,.5);}
#discHint{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.15em;}
#flash{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:var(--neon);color:#fff;
  padding:8px 16px;border-radius:12px;font-weight:700;display:none;white-space:nowrap;z-index:5;max-width:92vw;
  overflow:hidden;text-overflow:ellipsis;}
/* prop mode — a real object is grabbed; the phone only registers who got it */
#scr-arena.prop #zones{display:none;}
#scr-arena.prop #arena{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow-y:auto;padding:calc(52px + env(safe-area-inset-top,0px)) 14px 22px;}
/* auto margins: centred when it fits, scrolls from the top when it doesn't */
#scr-arena.prop #centerDisc{position:static;transform:none;flex:none;margin-top:auto;
  width:min(52vw,230px);height:min(52vw,230px);}
/* smaller disc than tap mode → step the word down so the longest entries
   (REGENBOOG, BEAUTIFUL — 9 chars) still fit on one line */
#scr-arena.prop #word{font-size:clamp(19px,6vw,32px);}
#propPick{display:none;flex-direction:column;align-items:center;gap:11px;margin:18px 0 auto;}
#scr-arena.prop #propPick{display:flex;}
#pickLabel{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.15em;}
#pickGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(430px,94vw);
  opacity:.28;pointer-events:none;transition:opacity .2s;}
#propPick.armed #pickGrid{opacity:1;pointer-events:auto;}
#nobodyBtn{visibility:hidden;}
#propPick.armed #nobodyBtn{visibility:visible;}
.pick{border:0;border-radius:14px;padding:14px 18px;font-family:'Bungee',system-ui;font-size:17px;
  color:var(--stage);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5);transition:transform .05s;}
.pick:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5);}
.pick.dead{opacity:.26;pointer-events:none;}
.pick.sm{font-size:14px;padding:9px 13px;box-shadow:0 3px 0 rgba(0,0,0,.5);}
.fixgrid{display:none;flex-wrap:wrap;gap:7px;justify-content:center;max-width:min(400px,92vw);margin-top:8px;}
.fixgrid.on{display:flex;}
/* sing */
.bigword{font-size:clamp(42px,13vw,80px);color:var(--sun);line-height:1;margin:6px 0 2px;
  text-shadow:0 0 24px rgba(255,207,63,.5);word-break:break-word;}
.singer{font-size:21px;}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--sun);border-radius:20px;
  padding:5px 12px;font-size:13px;font-weight:700;}
#ring{margin:16px 0;}
#ring circle.track{stroke:var(--line);fill:none;}
#ring circle.prog{stroke:var(--ice);fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;}
#ringNum{font-family:'Bungee';font-size:34px;fill:var(--paper);}
#ring circle.prog.loud,#ring circle.prog.heard{stroke:var(--good);}
/* mic meter */
#micMeter{display:none;flex-direction:column;align-items:center;gap:7px;width:min(300px,80vw);margin:2px 0 6px;}
.meterTrack{position:relative;width:100%;height:16px;border-radius:9px;background:var(--panel);
  border:1px solid var(--line);overflow:hidden;}
.meterFill{height:100%;width:0%;border-radius:9px;background:linear-gradient(90deg,var(--ice),var(--sun));
  transition:width .05s linear;}
.meterFill.loud{background:linear-gradient(90deg,var(--good),#c9ff6b);}
.meterMark{position:absolute;top:-2px;left:50%;width:3px;height:20px;background:var(--neon);border-radius:2px;}
#micStatus{font-size:13px;color:var(--dim);min-height:18px;}
#micStatus.hot{color:var(--good);font-weight:700;}
#micDbg{font-size:11px;color:var(--dim);opacity:.65;font-variant-numeric:tabular-nums;min-height:14px;}
/* vote / steal */
.votebtns{display:flex;gap:14px;margin-top:22px;}
.votebtns .btn{font-size:21px;padding:22px 24px;}
.vote-yes{background:var(--good);box-shadow:0 6px 0 var(--good-d);color:#123309;}
.vote-yes:active{box-shadow:0 2px 0 var(--good-d);}
#stealList{display:flex;flex-direction:column;gap:10px;width:min(300px,86vw);margin-top:18px;}
#stealList .btn{width:100%;font-size:16px;}
/* scoreboard */
#board,#winBoard{display:flex;flex-direction:column;gap:10px;width:min(360px,92vw);margin:18px 0;}
.srow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 14px;}
.srow .nm{flex:1;text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow .tok{letter-spacing:2px;font-size:17px;white-space:nowrap;}
.srow.mutedP{opacity:.5;}
.srow.outP{opacity:.35;text-decoration:line-through;}
.bar{flex:1.2;height:12px;border-radius:6px;background:var(--line);overflow:hidden;}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--ice),var(--good));border-radius:6px;transition:width .4s;}
.banner{font-size:clamp(24px,7vw,38px);max-width:92vw;}
.banner.good{color:var(--good);} .banner.bad{color:var(--neon);}
.roundinfo{color:var(--dim);font-size:13px;margin-top:8px;}
/* winner */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.cf{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
@media (prefers-reduced-motion: reduce){.cf{display:none;}}
.mutenote{color:var(--dim);font-size:13px;margin-top:14px;max-width:310px;}
/* fixed corner buttons */
.corner{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);
  color:var(--paper);border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer;
  top:calc(12px + env(safe-area-inset-top,0px));}
#sndToggle{right:12px;}
#pauseBtn{left:12px;display:none;}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  background:rgba(8,5,20,.82);backdrop-filter:blur(4px);padding:20px;}
.overlay.on{display:flex;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;
  width:min(380px,94vw);max-height:84vh;overflow-y:auto;text-align:center;}
.panel h2{font-family:'Bungee';font-size:20px;color:var(--sun);margin-bottom:12px;}
.panel .howto{text-align:left;font-size:14px;line-height:1.55;color:var(--paper);}
.panel .howto b{color:var(--sun);}
.panel .howto p{margin:8px 0;}
.plist{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.plist .srow{padding:8px 12px;}
.plist .rm{background:none;border:0;color:var(--neon);font-size:18px;cursor:pointer;padding:2px 8px;}
.histlist{text-align:left;font-size:14px;max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.histlist .h{display:flex;gap:8px;align-items:center;background:var(--stage);border-radius:8px;padding:7px 10px;}
.histlist .h .w{font-family:'Bungee';color:var(--sun);flex:1;text-align:left;font-size:13px;}
.langseg{position:static;margin-top:18px;}
.footer{color:var(--dim);font-size:12px;margin-top:26px;}
</style>
</head>
<body>
<button id="sndToggle" class="corner" title="sound">🔊</button>
<button id="pauseBtn" class="corner" title="pause">⏸</button>

<!-- HOME -->
<div class="screen on" id="scr-home">
  <div class="micmoji">🎤</div>
  <h1 class="logo display">SING-A-SONG</h1>
  <div class="sub" data-i18n="tagline"></div>
  <div style="height:26px"></div>
  <div class="stack">
    <button class="btn hot display wide" id="homeNew"></button>
    <button class="btn ice display wide" id="homeResume" style="display:none"></button>
    <button class="btn display wide" id="homeHow"></button>
  </div>
  <div class="seg langseg" id="langSeg">
    <button data-v="nl">Nederlands</button>
    <button data-v="en">English</button>
  </div>
  <div class="footer">Sing-a-Song v1.0 · <span data-i18n="offline"></span></div>
</div>

      <button data-v="15">15s</button>

    </div>
    <div class="opt" data-i18n="listenLbl"></div>
    <div class="toggles">
      <div class="tog" id="togMic"><div class="lbl"><span data-i18n="mic"></span><small data-i18n="micHint"></small></div><div class="sw"></div></div>

<!-- ARENA (countdown + grab) -->
<div class="screen" id="scr-arena">

    <svg id="zones"></svg>

      <div id="discHint"></div>
    </div>

    </div>

  </div>
</div>

<!-- SING -->
<div class="screen" id="scr-sing">

  <div class="bigword display" id="singWord"></div>
  <div class="sub" data-i18n="singPrompt"></div>

  </svg>

    <div id="micDbg"></div>
  </div>

  <button class="btn ghost" id="giveUpBtn"></button>
  <button class="btn ghost fixBtn" data-grid="fixSing" style="display:none"></button>
  <div class="fixgrid" id="fixSing"></div>
  <div class="mutenote" id="singNote" data-i18n="judgeNote"></div>
</div>

<!-- VOTE -->
<div class="screen" id="scr-vote">

  <div class="mutenote" data-i18n="voteNote"></div>
</div>

<!-- STEAL -->

<!-- SCORE INTERLUDE -->

  <div class="roundinfo" id="roundInfo"></div>
  <button class="btn display" id="nextBtn"></button>
  <button class="btn ghost" id="histBtn"></button>
</div>

<!-- WINNER -->
<div class="screen" id="scr-win">
  <div id="confetti"></div>
  <div class="sub">🏆 <span data-i18n="winner"></span> 🏆</div>
  <h1 class="logo display" id="winName"></h1>
  <div id="winBoard" style="margin-top:16px"></div>
  <div style="height:20px"></div>
  <div class="row">
    <button class="btn hot display" id="rematchBtn"></button>
    <button class="btn ghost" id="newGameBtn"></button>
  </div>
</div>

<!-- HOW TO PLAY overlay -->
<div class="overlay" id="ov-howto">
  <div class="panel">
    <h2 data-i18n="howTitle"></h2>
    <div class="howto" id="howBody"></div>
    <div style="height:14px"></div>
    <button class="btn ice display" id="howClose">OK</button>
  </div>
</div>

<!-- PAUSE overlay -->
<div class="overlay" id="ov-pause">
  <div class="panel">
    <h2 data-i18n="pauseTitle"></h2>
    <div class="plist" id="pausePlayers"></div>
    <div class="row" style="margin-bottom:14px">
      <input id="newPlayerName" maxlength="10" style="background:var(--stage);border:2px solid var(--line);border-radius:10px;color:var(--paper);padding:9px 12px;font-size:15px;outline:none;width:150px">
      <button class="btn ghost" id="pauseAdd" style="color:var(--ice)"></button>
    </div>
    <div class="stack">
      <button class="btn ice display wide" id="pauseResume"></button>
      <button class="btn ghost" id="pauseHist"></button>
      <button class="btn ghost" id="pauseQuit" style="color:var(--neon)"></button>
    </div>
  </div>
</div>

<!-- HISTORY overlay -->
<div class="overlay" id="ov-hist">
  <div class="panel">
    <h2 data-i18n="histTitle"></h2>
    <div class="histlist" id="histList"></div>
    <button class="btn ice display" id="histClose">OK</button>
  </div>
</div>

/* ================= AUDIO (Web Audio, synthesized) ================= */
let actx = null;
function ac(){ const A = window.AudioContext||window.webkitAudioContext;
  if(!actx) actx = new A(); if(actx.state==="suspended") actx.resume(); return actx; }
function tone(f, dur, {type="square", vol=0.18, slide=0, when=0}={}){
  if(!prefs.sound) return;
  try{
    const c = ac(), tt = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, tt);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), tt+dur);
    g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.001, tt+dur);
    o.connect(g).connect(c.destination); o.start(tt); o.stop(tt+dur+0.05);
  }catch(e){}
}
const snd = {
  tick(){ tone(900,.07,{vol:.12}); },
  reveal(){ tone(520,.12,{type:"sawtooth"}); tone(780,.18,{type:"sawtooth",when:.1}); },
  airhorn(){ for(const d of [0,.12,.24]) tone(440,.28,{type:"sawtooth",vol:.22,slide:-60,when:d});
             tone(880,.6,{type:"sawtooth",vol:.1,slide:-80}); },
  clocktick(){ tone(1400,.05,{vol:.15}); },
  buzzer(){ tone(140,.8,{type:"square",vol:.28}); tone(110,.8,{type:"square",vol:.2,when:.02}); },
  yes(){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,{type:"triangle",vol:.2,when:i*.09})); },
  no(){ [392,330,262,196].forEach((f,i)=>tone(f,.22,{type:"sawtooth",vol:.16,when:i*.14})); },
  early(){ tone(200,.25,{type:"square",vol:.2,slide:-80}); },
  fanfare(){ [523,523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.22,{type:"triangle",vol:.2,when:i*.13})); },
  boom(){ tone(90,.7,{type:"sawtooth",vol:.3,slide:-40}); },
  heard(){ tone(660,.12,{type:"triangle",vol:.18}); tone(990,.15,{type:"triangle",vol:.18,when:.09}); }
};

/* ================= MIC LISTENING (volume-only, no recording) ================= */
/* Live RMS metering: a rolling noise floor is tracked while quiet; sustained
   sound above a sensitivity-scaled threshold auto-stops the sing clock.
   Nothing is ever recorded or stored — only the instantaneous loudness. */
/* Tuning ladder (playtest iteration): "Normaal" is deliberately VERY sensitive,
   "Rustig" equals the previous — too hard to trigger — calibration. Playtest on
   Normaal, step to Rustig if chatter over-triggers, then pin a value in between. */
const SENS = { // {mult over floor, absolute floor delta, minimum threshold}
  low:  { mult:1.4,  add:0.003,  min:0.006 },  // "Rustig" — the old bar (firm voice)
  med:  { mult:1.2,  add:0.0015, min:0.003 },  // "Normaal" — very sensitive test setting
  high: { mult:1.1,  add:0.0008, min:0.002 }   // "Gevoelig" — extreme: barely above the floor
};
const FLOOR_MIN = 0.0015, FLOOR_MAX = 0.012;  // clamp so a noisy calibration can't inflate the bar
const MIC_SUSTAIN_MS = 250;   // must stay loud this long to count as "singing"
const MIC_GRACE_MS = 400;     // ignore the first moments (own grab-airhorn tail, screen tap)
const mic = { stream:null, analyser:null, data:null, floor:0.005, level:0,
              ready:false, denied:false, calibrating:false };
const clampFloor = v => Math.min(FLOOR_MAX, Math.max(FLOOR_MIN, v));

async function micInit(){
  if(mic.ready || mic.denied) return mic.ready;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ mic.denied = true; return false; }
  try{
    // AGC ON: the phone lies flat in the middle, singers are an arm's length away —
    // auto gain boosts a distant voice into range. EC ON so the app's own speaker
    // sounds don't trip the (now low) threshold. NS off: it can eat sustained notes.
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:false, autoGainControl:true } });
    const c = ac();
    const src = c.createMediaStreamSource(mic.stream);
    mic.analyser = c.createAnalyser();
    mic.analyser.fftSize = 1024;
    mic.data = new Float32Array(mic.analyser.fftSize);
    src.connect(mic.analyser);          // NOT connected to destination → no feedback, no playback
    mic.ready = true; mic.floor = 0.008;
    S.micOn = true;
    micCalibrate();
    return true;
  }catch(e){ mic.denied = true; S.micOn = false; return false; }
}
function micSignal(){
  // RMS + peak combined: singing is peaky (high crest factor), steady room hum
  // is not — taking max(rms, peak*0.35) lets a voice register at a distance
  // without dragging the noise floor up along with it.
  if(!mic.analyser) return 0;
  mic.analyser.getFloatTimeDomainData(mic.data);
  let sum = 0, peak = 0;
  for(let i=0;i<mic.data.length;i++){
    const v = mic.data[i]; sum += v*v;
    const a = v<0 ? -v : v; if(a>peak) peak = a;
  }
  return Math.max(Math.sqrt(sum / mic.data.length), peak*0.35);
}
function micCalibrate(){
  // sample ~800ms of ambient sound → noise floor
  mic.calibrating = true;
  const t0 = performance.now(); let acc = 0, n = 0;
  (function loop(){
    if(!mic.ready) { mic.calibrating = false; return; }
    acc += micSignal(); n++;
    if(performance.now()-t0 < 800){ requestAnimationFrame(loop); }
    else { mic.floor = clampFloor(acc/Math.max(1,n)); mic.calibrating = false; }
  })();
}
function micThreshold(){
  const s = SENS[S.settings.micSens] || SENS.med;
  let thr = Math.max(mic.floor * s.mult, mic.floor + s.add, s.min);
  if(S.settings.volume) thr *= 1.5;   // "Full volume" modifier demands more
  return thr;
}
function micStop(){
  try{ if(mic.stream) mic.stream.getTracks().forEach(tr=>tr.stop()); }catch(e){}
  mic.stream = null; mic.analyser = null; mic.ready = false; mic.denied = false;
  mic.level = 0; S.micOn = false;
}

/* Keeps the grab-mode choice honest: tap mode is unavailable above ZONE_MAX

/* ================= ARENA: wedges ================= */
function drawZones(){
  const svg = $("zones"), W = innerWidth, H = innerHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const cx = W/2, cy = H/2, R = Math.hypot(W,H);
  const n = S.players.length, off = -Math.PI/2;
  S.players.forEach((p,i)=>{
    const a0 = off + i*2*Math.PI/n, a1 = off + (i+1)*2*Math.PI/n;
    const x0 = cx + R*Math.cos(a0), y0 = cy + R*Math.sin(a0);
    const x1 = cx + R*Math.cos(a1), y1 = cy + R*Math.sin(a1);
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", n===1 ? `M 0 0 H ${W} V ${H} H 0 Z`
      : `M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1} Z`);
    path.setAttribute("fill", p.color);
    path.setAttribute("class", "wedge");
    path.dataset.i = i;
    if(p.deadRound || p.lockedCard || p.out) path.classList.add("dead");
    path.addEventListener("pointerdown", onZoneTap, {passive:false});
    svg.appendChild(path);
    const am = (a0+a1)/2, lr = Math.min(W,H)*0.40;
    const lx = cx + lr*Math.cos(am), ly = cy + lr*Math.sin(am);
    let deg = am*180/Math.PI + 90; if(deg>90 && deg<270) deg -= 180;
    const el = document.createElementNS("http://www.w3.org/2000/svg","text");
    el.setAttribute("x", lx); el.setAttribute("y", ly);
    el.setAttribute("text-anchor","middle");
    el.setAttribute("transform", `rotate(${deg} ${lx} ${ly})`);
    el.setAttribute("class","zlabel");
    el.textContent = (p.out ? "💀 " : p.deadRound ? "🔇 " : p.lockedCard ? "🙈 " : "") + p.name;
    svg.appendChild(el);
  });
}
addEventListener("resize", ()=>{
  if(!isProp() && (S.phase==="countdown"||S.phase==="grab")) drawZones();
});

/* ================= ARENA: name buttons (object mode) ================= */
function renderPicks(){
  const g = $("pickGrid"); g.innerHTML = "";

    const b = document.createElement("button");
    b.className = "pick" + (p.deadRound ? " dead" : "");
    b.style.background = p.color;
    b.textContent = (p.deadRound ? "🔇 " : "") + p.name;
    b.onclick = () => onPick(i);
    g.appendChild(b);

}
function onPick(i){
  if(S.phase !== "grab") return;
  const p = S.players[i];
  if(!p || p.out || p.deadRound) return;
  grabbedBy(i);
}
$("nobodyBtn").onclick = () => {

/* ================= ROUND FLOW ================= */
function drawWord(){
  if(S.deck.length===0){ buildDeck(); flash(t("deckReshuffled")); }
  S.word = S.deck.pop();
}
function startRound(){
  clearTimeout(noGrabT); clearInterval(cdIv);
  drawWord();
  S.grabber = -1; S.stealer = -1; S.stealing = false;
  S.players.forEach(p => {
    p.lockedCard = false;
    p.deadRound = p.mutedNext && !p.out;   // sit out exactly this card
    p.mutedNext = false;
  });
  // If EVERY playable player is muted (e.g. grabber + stealer both failed the
  // same card), nobody could grab and the game would stall — forgive them all.
  const activeP = S.players.filter(p => !p.out);
  const allMuted = activeP.length > 0 && activeP.every(p => p.deadRound);
  if(allMuted) activeP.forEach(p => { p.deadRound = false; });
  S.phase = "countdown";
  saveSession();
  const prop = isProp();
  $("scr-arena").classList.toggle("prop", prop);
  show("scr-arena");
  if(prop){ renderPicks(); $("propPick").classList.remove("armed"); $("pickLabel").textContent = t("propReady"); }
  else drawZones();
  if(allMuted) flash(t("allMuted"));
  $("word").style.display = "none";
  $("cd").style.display = "block";
  $("discHint").textContent = t("getReady");
  let c = 3;
  $("cd").textContent = c; snd.tick();
  cdIv = setInterval(()=>{
    c--;
    if(c>0){ $("cd").textContent = c; snd.tick(); }
    else{
      clearInterval(cdIv); cdIv = null;
      if(S.phase!=="countdown") return;
      // nobody left who can grab (all early-tap locked/muted)? skip straight
      // to a fresh card instead of stalling — vital when grab time is set to ∞
      if(!S.players.some(p => !p.out && !p.deadRound && !p.lockedCard)){
        S.phase = "between";
        flash(t("nobody")); snd.no();
        setTimeout(startRound, 900);
        return;
      }
      S.phase = "grab"; S.grabTimeStamp = 0;
      $("cd").style.display = "none";
      $("word").textContent = S.word; $("word").style.display = "block";
      $("discHint").textContent = prop ? t("grabNowProp") : t("grabNow");
      snd.reveal();
      if(prop){
        // The physical grab already decided it; tapping a name is only
        // registration, so there is no auto-discard timer here — a group still
        // laughing five seconds later must not lose a valid grab. The explicit
        // "nobody" button ends the card instead.
        $("pickLabel").textContent = t("propWho");
        $("propPick").classList.add("armed");
      }else{
        drawZones();
        if(S.settings.grabTime > 0){
          noGrabT = setTimeout(()=>{
            if(S.phase==="grab"){
              S.phase="between"; flash(t("nobody")); snd.no();
              setTimeout(startRound, 900);
            }
          }, S.settings.grabTime*1000);
        }
      }
    }
  }, 800);
}

function onZoneTap(e){
  e.preventDefault();
  const i = +e.currentTarget.dataset.i, p = S.players[i];
  if(!p || p.out) return;
  if(S.phase === "countdown"){
    if(!p.lockedCard && !p.deadRound){
      p.lockedCard = true; snd.early(); buzz(60);
      flash(t("tooSoon", p.name)); drawZones();
    }
    return;
  }
  if(S.phase !== "grab"){
    if(S.phase==="grabbed" && S.grabTimeStamp && performance.now()-S.grabTimeStamp < 250 && i !== S.grabber){
      const ms = Math.round(performance.now()-S.grabTimeStamp);
      flash(t("faster", S.players[S.grabber].name, ms, p.name));
    }
    return;
  }
  if(p.deadRound || p.lockedCard) return;
  grabbedBy(i);
}

function grabbedBy(i){
  S.phase = "grabbed"; S.grabber = i; S.grabTimeStamp = performance.now();
  clearTimeout(noGrabT);
  snd.airhorn(); buzz([30,40,30]);
  setTimeout(startSing, 600);
}

/* ================= WRONG-NAME CORRECTION =================
   Object mode only. There the tap is bookkeeping, not the race result, so a
   mis-tap must be undoable before a token is handed out. In tap mode the tap
   IS the result and rewriting it would just be griefable. */
let singRAF = null;
function currentSinger(){ return S.players[S.stealing ? S.stealer : S.grabber]; }
function setSinger(i){
  if(S.stealing) S.stealer = i; else S.grabber = i;
  $("singerName").textContent = S.players[i].name;
  $("voteName").textContent = S.players[i].name;
}
function closeFixGrids(){ document.querySelectorAll(".fixgrid").forEach(g=>g.classList.remove("on")); }
function syncFixButtons(){
  const on = isProp();
  document.querySelectorAll(".fixBtn").forEach(b => b.style.display = on ? "" : "none");
  if(!on) closeFixGrids();
}
document.querySelectorAll(".fixBtn").forEach(btn => {
  const grid = $(btn.dataset.grid);
  btn.onclick = () => {
    if(grid.classList.contains("on")){ grid.classList.remove("on"); return; }
    grid.innerHTML = "";
    const cur = S.stealing ? S.stealer : S.grabber;
    S.players.forEach((p,i)=>{
      if(p.out || p.deadRound || i === cur) return;
      const b = document.createElement("button");
      b.className = "pick sm"; b.style.background = p.color; b.textContent = p.name;
      b.onclick = () => { setSinger(i); grid.classList.remove("on"); };
      grid.appendChild(b);
    });
    grid.classList.add("on");
  };
});
function startSing(){
  S.phase = "sing";
  show("scr-sing");
  closeFixGrids(); syncFixButtons();
  $("singerName").textContent = currentSinger().name;
  $("voteName").textContent = currentSinger().name;
  $("singWord").textContent = S.word;
  const chips = $("singChips"); chips.innerHTML = "";
  if(S.settings.solo){ const c=document.createElement("span"); c.className="chip"; c.textContent=t("solo"); chips.appendChild(c); }
  if(S.settings.volume){ const c=document.createElement("span"); c.className="chip"; c.textContent=t("volume"); chips.appendChild(c); }

  const micActive = S.settings.mic && mic.ready;
  const meter = $("micMeter"), fill = $("meterFill"), status = $("micStatus"), prog = $("ringProg");
  meter.style.display = micActive ? "flex" : "none";
  fill.classList.remove("loud"); status.classList.remove("hot");
  prog.classList.remove("loud","heard");
  $("singingBtn").style.display = "";
  if(micActive){ status.textContent = t("micListening"); $("singNote").textContent = t("micHint"); }
  else{
    $("singNote").textContent = S.settings.mic ? (mic.denied ? t("micDenied") : t("micUnavailable")) : t("judgeNote");
  }

  const secs = S.settings.singSecs;
  const hasTimer = secs > 0;
  // performance-clock rule: with the timer on, you sing the FULL window.
  // Detection (or the judge button) only *registers* that singing happened;
  // the vote screen appears when the clock runs out. No registration → fail.
  S.singReg = false; S.singHasTimer = hasTimer;
  $("ring").style.display = hasTimer ? "" : "none";
  if(!hasTimer && !micActive){
    const c=document.createElement("span"); c.className="chip"; c.textContent="⏱ "+t("noTimer"); chips.appendChild(c);
  }
  const circ = 2*Math.PI*64;
  prog.style.strokeDasharray = circ; prog.style.strokeDashoffset = 0;
  const t0 = performance.now(), total = secs*1000;
  let lastWhole = secs, lastNow = t0, loudMs = 0, lastDbg = 0;
  const dbg = $("micDbg"); dbg.textContent = "";
  $("ringNum").textContent = secs;

  function frame(now){
    if(S.phase !== "sing") return;
    const dt = now - lastNow; lastNow = now;
    // --- timer ---
    if(hasTimer){
      const left = Math.max(0, total-(now-t0));
      prog.style.strokeDashoffset = circ * (1 - left/total);
      const s = Math.ceil(left/1000);
      $("ringNum").textContent = s;
      if(s !== lastWhole){ lastWhole = s; if(s<=3 && s>0) snd.clocktick(); }
      if(left<=0){
        if(S.singReg) stopToVote(); else singFail(t("tooLate"));
        return;
      }
    }
    // --- mic detection ---
    if(micActive){
      const rms = (mic.testLevel != null) ? mic.testLevel : micSignal();
      mic.level = mic.level*0.6 + rms*0.4;
      const thr = micThreshold();
      if(mic.level < thr) mic.floor = clampFloor(mic.floor*0.985 + mic.level*0.015);  // adapt when quiet
      const loud = mic.level > thr;
      fill.style.width = Math.min(100, mic.level/(thr*2)*100).toFixed(1) + "%";
      fill.classList.toggle("loud", loud);
      prog.classList.toggle("loud", loud);
      if(now - lastDbg > 150){ // live tuning readout for playtests
        lastDbg = now;
        dbg.textContent = `mic ${mic.level.toFixed(4)} · trig ${thr.toFixed(4)}`;
      }
      if(!S.singReg){
        if(now - t0 > MIC_GRACE_MS) loudMs = loud ? loudMs + dt : Math.max(0, loudMs - dt*0.6);
        if(loudMs >= MIC_SUSTAIN_MS) registerSing();
      }
    }
    singRAF = requestAnimationFrame(frame);
  }
  singRAF = requestAnimationFrame(frame);
}
function registerSing(){
  // mark "we heard singing" — the round continues until the clock runs out
  if(S.phase !== "sing" || S.singReg) return;
  S.singReg = true;
  snd.heard(); buzz(40);
  const st = $("micStatus");
  st.textContent = t("micHeard"); st.classList.add("hot");
  $("ringProg").classList.add("heard");
  if(S.singHasTimer){
    $("singNote").textContent = t("keepSinging");
    $("singingBtn").style.display = "none";
  }
}
function stopToVote(){
  if(S.phase !== "sing") return;
  S.phase = "vote";
  snd.heard(); buzz(40);
  show("scr-vote");
  closeFixGrids();
  $("voteName").textContent = currentSinger().name;
  $("voteWord").textContent = S.word;
}
$("singingBtn").onclick = () => {
  if(S.phase !== "sing") return;
  // with the timer on, the judge button registers (clock keeps running);
  // without a timer it is the "done → vote" control
  if(S.singHasTimer) registerSing(); else stopToVote();
};
$("giveUpBtn").onclick = () => {
  if(S.phase !== "sing") return;
  singFail(t("gaveUp", currentSinger().name));
};
function singFail(banner){
  S.phase = "fail";
  snd.buzzer(); buzz(200);
  resolveAttempt(false, banner);
}

/* ================= VOTE ================= */
$("voteYes").onclick = () => { if(S.phase!=="vote")return; snd.yes(); buzz([20,30,20]); resolveAttempt(true); };
$("voteNo").onclick  = () => { if(S.phase!=="vote")return; snd.no();  buzz(120); resolveAttempt(false); };

/* ================= RESULT / MODES ================= */
function reward(p){
  p.tokens++;
  if(S.settings.mode==="race") p.space = Math.min(RACE_LEN, p.space+1);
}
function penalize(p){
  p.mutedNext = true;
  if(S.settings.mode==="battle"){
    p.mutes++;
    if(p.mutes >= 2){ p.out = true; p.mutedNext = false; }
  }
  if(S.settings.mode==="race") p.space = Math.max(0, p.space-1);
}
function checkWinner(){
  const m = S.settings.mode, ps = S.players;
  if(m==="classic"){ return ps.find(p=>p.tokens >= S.settings.goal) || null; }
  if(m==="race"){ return ps.find(p=>p.space >= RACE_LEN) || null; }
  if(m==="battle"){ const a = alivePlayers(); return a.length<=1 ? (a[0]||ps[0]) : null; }
  if(m==="quick" && S.roundsPlayed >= S.settings.rounds){
    const max = Math.max(...ps.map(p=>p.tokens));
    const leaders = ps.filter(p=>p.tokens===max);
    if(leaders.length===1) return leaders[0];
    S.overtime = true;
  }
  return null;
}
function resolveAttempt(ok, bannerOverride){
  const p = currentSinger();
  S.history.push({ word:S.word, name:p.name, ok });
  if(ok) reward(p); else penalize(p);
  if(!S.stealing) S.roundsPlayed++;
  const wasEliminated = p.out && S.settings.mode==="battle";
  const winner = checkWinner();
  saveSession();
  if(winner) return win(winner);
  // steal chance: only after a failed ORIGINAL attempt
  if(!ok && !S.stealing && S.settings.steal){
    const eligible = S.players.map((q,i)=>({q,i}))
      .filter(({q,i}) => i!==S.grabber && !q.out && !q.deadRound);
    if(eligible.length){ return showSteal(eligible, bannerOverride); }
  }
  showScore(ok, p, bannerOverride, wasEliminated);
}
function showScore(ok, p, bannerOverride, eliminated){
  S.phase = "score";
  let banner = bannerOverride || (ok ? t("plusOne", p.name) : t("gotMute", p.name));
  if(eliminated){ banner = t("eliminated", p.name); snd.boom(); }
  if(S.overtime && S.settings.mode==="quick" && S.roundsPlayed>=S.settings.rounds){
    banner = t("overtime");
  }
  $("scoreBanner").textContent = banner;
  $("scoreBanner").className = "banner display " + (ok ? "good" : "bad");
  renderBoard($("board"));
  renderRoundInfo();
  show("scr-score");
}
function renderRoundInfo(){
  $("roundInfo").textContent = S.settings.mode==="quick"
    ? t("roundOf", Math.min(S.roundsPlayed+1, S.settings.rounds), S.settings.rounds) : "";
}

/* ================= STEAL ================= */
function showSteal(eligible, pendingBanner){
  S.phase = "steal";
  S._pendingBanner = pendingBanner;
  show("scr-steal");
  $("stealWord").textContent = S.word;
  const list = $("stealList"); list.innerHTML = "";
  eligible.forEach(({q,i})=>{
    const b = document.createElement("button");
    b.className = "btn ice display";
    b.textContent = q.name;
    b.onclick = () => {
      S.stealing = true; S.stealer = i;
      snd.airhorn(); buzz(30);
      startSing();
    };
    list.appendChild(b);
  });
}
$("stealSkip").onclick = () => {
  if(S.phase!=="steal") return;
  showScore(false, S.players[S.grabber], S._pendingBanner);
};

/* ================= SCOREBOARD ================= */
function renderBoard(el){
  el.innerHTML = "";
  const mode = S.settings.mode;
  const sorted = [...S.players].sort((a,b)=>
    mode==="race" ? b.space-a.space : b.tokens-a.tokens);
  sorted.forEach(p=>{
    const r = document.createElement("div");
    r.className = "srow" + (p.out ? " outP" : p.mutedNext ? " mutedP" : "");
    const status = p.out ? " 💀" : (p.mutedNext ? " 🔇" : "");
    let right;
    if(mode==="race"){
      right = `<div class="bar"><div class="fill" style="width:${p.space/RACE_LEN*100}%"></div></div>
               <span class="tok">${esc(t("spacesLbl", p.space))}</span>`;
    }else{
      const strikes = mode==="battle" ? " " + "⚡".repeat(p.mutes) : "";
      right = `<span class="tok">${"🎤".repeat(p.tokens) || "—"}${strikes}</span>`;
    }
    r.innerHTML = `<span class="dot" style="background:${p.color}"></span>
      <span class="nm">${esc(p.name)}${status}</span>${right}`;
    el.appendChild(r);
  });
}
$("nextBtn").onclick = () => startRound();
$("histBtn").onclick = () => showHistory();

/* ================= HISTORY ================= */
function showHistory(){
  const list = $("histList"); list.innerHTML = "";
  if(S.history.length===0){
    list.innerHTML = `<div style="color:var(--dim)">${esc(t("histEmpty"))}</div>`;
  }else{
    [...S.history].reverse().forEach(h=>{
      const d = document.createElement("div"); d.className="h";
      d.innerHTML = `<span class="w">${esc(h.word)}</span><span>${esc(h.name)}</span><span>${h.ok?"✅":"❌"}</span>`;
      list.appendChild(d);
    });
  }
  overlay("ov-hist", true);
}
$("histClose").onclick = () => overlay("ov-hist", false);

/* ================= PAUSE ================= */
$("pauseBtn").onclick = () => {
  if(S.phase==="countdown" || S.phase==="grab"){
    // freeze the round; the current word goes back on top of the deck
    clearInterval(cdIv); clearTimeout(noGrabT);
    if(S.word){ S.deck.push(S.word); S.word=""; }
    S.phase = "paused-round";
  }else if(S.phase==="score"){
    S.phase = "paused-score";
  }else return;
  renderPausePlayers();
  overlay("ov-pause", true);
};
function renderPausePlayers(){
  const el = $("pausePlayers"); el.innerHTML = "";
  S.players.forEach((p,i)=>{
    const r = document.createElement("div"); r.className="srow";
    r.innerHTML = `<span class="dot" style="background:${p.color}"></span>
      <span class="nm">${esc(p.name)}${p.out?" 💀":""}</span>`;
    const rm = document.createElement("button"); rm.className="rm"; rm.textContent="✕";
    rm.onclick = () => {
      if(S.players.length <= MIN_PLAYERS) return;
      S.players.splice(i,1); S.grabber=-1; saveSession(); renderPausePlayers();
    };
    r.appendChild(rm);
    el.appendChild(r);
  });
}
$("pauseAdd").onclick = () => {
  const name = $("newPlayerName").value.trim();
  if(!name || S.players.length >= MAX_PLAYERS) return;
  const used = new Set(S.players.map(p=>p.color));
  const color = COLORS.find(c=>!used.has(c)) || COLORS[S.players.length % COLORS.length];
  const p = newPlayer(name, 0); p.color = color;
  S.players.push(p);
  $("newPlayerName").value = "";
  saveSession(); renderPausePlayers();
};
$("pauseResume").onclick = () => {
  overlay("ov-pause", false);
  if(S.phase==="paused-round"){ startRound(); }
  else { S.phase="score"; renderBoard($("board")); renderRoundInfo(); show("scr-score"); }
};
$("pauseHist").onclick = () => showHistory();
$("pauseQuit").onclick = () => {
  if(!confirm(t("quitConfirm"))) return;
  overlay("ov-pause", false);
  clearSession(); micStop();
  S.phase = "home"; refreshHome(); show("scr-home");
};

/* ================= WINNER ================= */
function win(p){
  S.phase = "win";
  clearSession();
  show("scr-win");
  $("winName").textContent = p.name;
  renderBoard($("winBoard"));
  snd.fanfare(); buzz([40,60,40,60,120]);
  const box = $("confetti"); box.innerHTML = "";
  for(let i=0;i<70;i++){
    const c = document.createElement("div"); c.className = "cf";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = COLORS[i % COLORS.length];
    c.style.animationDuration = (2+Math.random()*2.5) + "s";
    c.style.animationDelay = Math.random()*1.2 + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(c);
  }
}
$("rematchBtn").onclick = () => {
  S.players.forEach(p=>{ p.tokens=0; p.mutes=0; p.space=0; p.mutedNext=false; p.deadRound=false; p.lockedCard=false; p.out=false; });
  S.roundsPlayed = 0; S.history = []; S.overtime = false;
  buildDeck(); startRound();
};
$("newGameBtn").onclick = () => { clearSession(); location.reload(); };

/* ================= SOUND / WAKELOCK / PWA ================= */
$("sndToggle").onclick = e => {
  prefs.sound = !prefs.sound; savePrefs();
  e.target.textContent = prefs.sound ? "🔊" : "🔇";
};
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && S.phase!=="home" && S.phase!=="setup") keepAwake();
});
if(location.protocol.startsWith("http") && "serviceWorker" in navigator){
  addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ================= INIT ================= */
window.__sas = S; window.__mic = mic; window.__micThreshold = micThreshold; // debug/test handles

$("sndToggle").textContent = prefs.sound ? "🔊" : "🔇";
restoreSetupPrefs();
$("togMic").classList.toggle("on", S.settings.mic);   // sync mic toggle even on a fresh install
segSet("sensSeg", S.settings.micSens);
updateMicUI();
applyLang();
refreshHome();
</script>
</body>
</html>
